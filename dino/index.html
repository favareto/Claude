<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dino - Meu Ajudante de Tarefas</title>
<style>
  :root {
    --azul: #17aef2;
    --azul-escuro: #0d8fd0;
    --azul-claro: #e6f6ff;
    --amarelo: #ffc93c;
    --verde: #4ecb71;
    --vermelho: #ff6b6b;
    --texto: #2b3a4a;
    --fundo: #f2f9ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Trebuchet MS', 'Segoe UI', Verdana, sans-serif;
    background: linear-gradient(180deg, var(--fundo) 0%, #ffffff 60%);
    color: var(--texto);
    min-height: 100vh;
  }
  .app {
    max-width: 900px;
    margin: 0 auto;
    padding: 16px 16px 60px;
  }
  h1 {
    text-align: center;
    font-size: clamp(24px, 5vw, 34px);
    color: var(--azul-escuro);
    margin: 8px 0 4px;
  }
  .subtitle {
    text-align: center;
    color: #6b7f8f;
    margin-bottom: 20px;
    font-size: 16px;
  }

  .dino-stage {
    background: white;
    border-radius: 24px;
    box-shadow: 0 8px 24px rgba(23,174,242,0.15);
    padding: 20px;
    text-align: center;
    margin-bottom: 24px;
    position: relative;
    overflow: hidden;
  }
  .level-badge {
    display: inline-block;
    background: var(--azul);
    color: white;
    font-weight: bold;
    padding: 6px 18px;
    border-radius: 999px;
    font-size: 15px;
    margin-bottom: 6px;
  }
  .dino-wrap {
    width: 220px;
    height: 170px;
    margin: 6px auto 4px;
    position: relative;
    transition: transform 0.4s ease;
  }
  .dino-wrap.bounce { animation: bounce 0.6s ease; }
  .dino-wrap.levelup { animation: spinPop 0.9s ease; }
  @keyframes bounce {
    0% { transform: translateY(0) scale(var(--s,1)); }
    30% { transform: translateY(-18px) scale(var(--s,1)); }
    55% { transform: translateY(0) scale(var(--s,1)); }
    75% { transform: translateY(-8px) scale(var(--s,1)); }
    100% { transform: translateY(0) scale(var(--s,1)); }
  }
  @keyframes spinPop {
    0% { transform: scale(var(--s,1)) rotate(0deg); }
    40% { transform: scale(calc(var(--s,1) * 1.25)) rotate(-8deg); }
    70% { transform: scale(calc(var(--s,1) * 1.25)) rotate(8deg); }
    100% { transform: scale(var(--s,1)) rotate(0deg); }
  }
  .hat {
    position: absolute;
    top: -6px;
    left: 24px;
    font-size: 34px;
    display: none;
    transform: rotate(-15deg);
  }
  .dino-wrap.max-level .hat { display: block; }

  .speech-bubble {
    background: var(--azul-claro);
    border: 2px solid var(--azul);
    border-radius: 16px;
    padding: 10px 16px;
    max-width: 420px;
    margin: 6px auto 18px;
    font-size: 16px;
    font-weight: 600;
    min-height: 24px;
  }

  .xp-bar-wrap { max-width: 380px; margin: 0 auto; }
  .xp-bar {
    background: #e4eef5;
    border-radius: 999px;
    height: 22px;
    overflow: hidden;
    border: 2px solid #cfe4f2;
  }
  .xp-fill {
    background: linear-gradient(90deg, var(--amarelo), #ffb03c);
    height: 100%;
    width: 0%;
    transition: width 0.6s ease;
    border-radius: 999px;
  }
  .xp-text { margin-top: 6px; font-size: 14px; color: #6b7f8f; font-weight: bold; }

  .tasks-panel {
    background: white;
    border-radius: 24px;
    box-shadow: 0 8px 24px rgba(23,174,242,0.1);
    padding: 20px;
  }
  .tasks-panel h2 {
    color: var(--azul-escuro);
    font-size: 20px;
    margin-top: 0;
  }
  #taskList { list-style: none; padding: 0; margin: 0 0 16px; }
  #taskList li {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--azul-claro);
    border-radius: 14px;
    padding: 12px 14px;
    margin-bottom: 10px;
    font-size: 17px;
  }
  #taskList li.done { background: #eafaef; }
  #taskList li.done .task-text { text-decoration: line-through; color: #9ab; }
  #taskList input[type="checkbox"] {
    width: 26px;
    height: 26px;
    accent-color: var(--verde);
    cursor: pointer;
    flex-shrink: 0;
  }
  .task-text { flex: 1; word-break: break-word; }
  .delete-btn {
    background: none;
    border: none;
    color: var(--vermelho);
    font-size: 20px;
    cursor: pointer;
    padding: 2px 8px;
    line-height: 1;
  }
  #addTaskForm { display: flex; gap: 10px; }
  #newTaskInput {
    flex: 1;
    padding: 12px 14px;
    border-radius: 14px;
    border: 2px solid #cfe4f2;
    font-size: 16px;
    font-family: inherit;
  }
  #newTaskInput:focus { outline: none; border-color: var(--azul); }
  #addTaskForm button {
    background: var(--azul);
    color: white;
    border: none;
    border-radius: 14px;
    padding: 12px 20px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
  }
  #addTaskForm button:active { background: var(--azul-escuro); }

  .empty-msg { color: #9ab; text-align: center; padding: 12px 0; }

  .confetti {
    position: fixed;
    top: -30px;
    font-size: 22px;
    pointer-events: none;
    animation: fall linear forwards;
    z-index: 999;
  }
  @keyframes fall {
    to { transform: translateY(110vh) rotate(360deg); opacity: 0.9; }
  }

  footer {
    text-align: center;
    color: #b7c6d1;
    font-size: 12px;
    margin-top: 24px;
  }
</style>
</head>
<body>
<div class="app">
  <h1>🦕 Dino - Meu Ajudante de Tarefas</h1>
  <p class="subtitle">Termine suas tarefas e ajude o Dino a crescer!</p>

  <div class="dino-stage">
    <div class="level-badge" id="levelBadge">Nível 1: Bebê</div>
    <div class="dino-wrap" id="dinoWrap">
      <span class="hat" id="hat">🎉</span>
      <svg id="dinoSvg" viewBox="0 0 300 220" width="100%" height="100%">
        <ellipse cx="185" cy="90" rx="16" ry="30" fill="#ffffff" stroke="#cfd8e3" stroke-width="3" transform="rotate(35 185 90)"/>
        <ellipse cx="150" cy="140" rx="78" ry="50" fill="#ffffff" stroke="#cfd8e3" stroke-width="3"/>
        <path d="M75 130 C 40 110, 30 70, 62 48 C 78 38, 92 46, 88 62 C 84 78, 95 100, 100 120 Z" fill="#ffffff" stroke="#cfd8e3" stroke-width="3"/>
        <circle cx="66" cy="55" r="26" fill="#ffffff" stroke="#cfd8e3" stroke-width="3"/>
        <circle cx="55" cy="48" r="5.5" fill="#2b3a4a"/>
        <circle cx="57" cy="46" r="2" fill="#ffffff"/>
        <ellipse cx="50" cy="62" rx="7" ry="4" fill="#ffc7c7" opacity="0.7"/>
        <path d="M52 66 Q 60 72, 68 66" stroke="#2b3a4a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <ellipse cx="86" cy="52" rx="2.3" ry="3" fill="#c9d4dc"/>
        <g id="spikes">
          <polygon id="spike1" points="118,92 128,72 138,92" fill="#ffffff" stroke="#17aef2" stroke-width="2.5"/>
          <polygon id="spike2" points="140,88 150,66 160,88" fill="#ffffff" stroke="#17aef2" stroke-width="2.5"/>
          <polygon id="spike3" points="162,90 172,70 182,90" fill="#ffffff" stroke="#17aef2" stroke-width="2.5"/>
          <polygon id="spike4" points="184,94 194,76 204,94" fill="#ffffff" stroke="#17aef2" stroke-width="2.5"/>
        </g>
        <path d="M70 45 C 100 20, 150 78, 168 92 C 185 106, 210 96, 218 84"
              fill="none" stroke="#17aef2" stroke-width="7" stroke-linecap="round"/>
        <rect x="118" y="168" width="18" height="34" rx="9" fill="#ffffff" stroke="#cfd8e3" stroke-width="3"/>
        <rect x="168" y="168" width="18" height="34" rx="9" fill="#ffffff" stroke="#cfd8e3" stroke-width="3"/>
        <ellipse cx="127" cy="203" rx="13" ry="6" fill="#ffffff" stroke="#cfd8e3" stroke-width="3"/>
        <ellipse cx="177" cy="203" rx="13" ry="6" fill="#ffffff" stroke="#cfd8e3" stroke-width="3"/>
      </svg>
    </div>
    <div class="speech-bubble" id="speech">Oi! Eu sou o Dino! Vamos fazer as tarefas de hoje?</div>
    <div class="xp-bar-wrap">
      <div class="xp-bar"><div class="xp-fill" id="xpFill"></div></div>
      <div class="xp-text" id="xpText">0 / 40 XP</div>
    </div>
  </div>

  <div class="tasks-panel">
    <h2>📋 Tarefas de hoje</h2>
    <ul id="taskList"></ul>
    <form id="addTaskForm">
      <input id="newTaskInput" type="text" placeholder="Digite uma nova tarefa..." maxlength="60" required>
      <button type="submit">Adicionar</button>
    </form>
  </div>

  <footer>Feito com carinho para o Dino crescer todo dia 🦕💙</footer>
</div>

<script>
(function () {
  var STORAGE_KEY = 'dinoAppState';

  var LEVELS = [
    { name: 'Bebê',        min: 0,   max: 40,      scale: 0.62 },
    { name: 'Filhote',     min: 40,  max: 100,     scale: 0.78 },
    { name: 'Crescendo',   min: 100, max: 180,     scale: 0.92 },
    { name: 'Quase Adulto',min: 180, max: 280,     scale: 1.06 },
    { name: 'Dino Mestre', min: 280, max: Infinity,scale: 1.2 }
  ];

  var PRAISES = [
    'Arrasou! ⭐', 'Muito bem! 🎉', 'Isso aí, campeão!', 'O Dino ficou feliz! 💙',
    'Uhuu, tarefa completa!', 'Você é demais!', 'O Dino está orgulhoso de você!'
  ];

  var defaultTasks = [
    'Escovar os dentes',
    'Arrumar a cama',
    'Fazer a lição de casa',
    'Guardar os brinquedos',
    'Ler um pouquinho'
  ];

  var state = load();
  checkNewDay();
  render();

  document.getElementById('addTaskForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var input = document.getElementById('newTaskInput');
    var text = input.value.trim();
    if (!text) return;
    state.tasks.push({ id: Date.now(), text: text, done: false });
    input.value = '';
    save();
    render();
  });

  function load() {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      try { return JSON.parse(raw); } catch (e) { /* fall through to defaults */ }
    }
    return {
      xp: 0,
      tasks: defaultTasks.map(function (t) { return { id: Date.now() + Math.random(), text: t, done: false }; }),
      lastDate: todayStr(),
      bonusDate: null
    };
  }

  function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

  function todayStr() {
    var d = new Date();
    return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
  }

  function checkNewDay() {
    var today = todayStr();
    if (state.lastDate !== today) {
      state.tasks.forEach(function (t) { t.done = false; });
      state.lastDate = today;
      save();
    }
  }

  function getLevelIndex(xp) {
    for (var i = 0; i < LEVELS.length; i++) {
      if (xp >= LEVELS[i].min && xp < LEVELS[i].max) return i;
    }
    return LEVELS.length - 1;
  }

  function render() {
    renderTasks();
    renderDino();
  }

  function renderTasks() {
    var list = document.getElementById('taskList');
    list.innerHTML = '';
    if (state.tasks.length === 0) {
      var p = document.createElement('p');
      p.className = 'empty-msg';
      p.textContent = 'Nenhuma tarefa ainda. Adicione uma abaixo!';
      list.appendChild(p);
      return;
    }
    state.tasks.forEach(function (task) {
      var li = document.createElement('li');
      if (task.done) li.className = 'done';

      var checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.checked = task.done;
      checkbox.addEventListener('change', function () { toggleTask(task.id); });

      var span = document.createElement('span');
      span.className = 'task-text';
      span.textContent = task.text;

      var delBtn = document.createElement('button');
      delBtn.className = 'delete-btn';
      delBtn.type = 'button';
      delBtn.innerHTML = '&times;';
      delBtn.title = 'Remover tarefa';
      delBtn.addEventListener('click', function () { deleteTask(task.id); });

      li.appendChild(checkbox);
      li.appendChild(span);
      li.appendChild(delBtn);
      list.appendChild(li);
    });
  }

  function renderDino(animateClass) {
    var levelIndex = getLevelIndex(state.xp);
    var level = LEVELS[levelIndex];
    var wrap = document.getElementById('dinoWrap');

    document.getElementById('levelBadge').textContent = 'Nível ' + (levelIndex + 1) + ': ' + level.name;
    wrap.style.setProperty('--s', level.scale);
    wrap.style.transform = 'scale(' + level.scale + ')';
    wrap.classList.toggle('max-level', levelIndex === LEVELS.length - 1);

    for (var i = 1; i <= 4; i++) {
      var spike = document.getElementById('spike' + i);
      spike.style.opacity = (levelIndex + 1) >= i ? '1' : '0';
    }

    var xpFill = document.getElementById('xpFill');
    var xpText = document.getElementById('xpText');
    if (level.max === Infinity) {
      xpFill.style.width = '100%';
      xpText.textContent = state.xp + ' XP — Nível máximo! 🏆';
    } else {
      var pct = Math.max(0, Math.min(100, ((state.xp - level.min) / (level.max - level.min)) * 100));
      xpFill.style.width = pct + '%';
      xpText.textContent = state.xp + ' / ' + level.max + ' XP';
    }

    if (animateClass) {
      wrap.classList.remove('bounce', 'levelup');
      void wrap.offsetWidth;
      wrap.classList.add(animateClass);
    }
  }

  function say(msg) {
    document.getElementById('speech').textContent = msg;
  }

  function toggleTask(id) {
    var task = state.tasks.find(function (t) { return t.id === id; });
    if (!task) return;
    var levelBefore = getLevelIndex(state.xp);

    task.done = !task.done;
    state.xp += task.done ? 10 : -10;
    if (state.xp < 0) state.xp = 0;

    if (task.done) {
      var allDone = state.tasks.length > 0 && state.tasks.every(function (t) { return t.done; });
      if (allDone && state.bonusDate !== state.lastDate) {
        state.xp += 15;
        state.bonusDate = state.lastDate;
        launchConfetti();
        say('Uau, todas as tarefas feitas! Bônus de +15 XP! 🎉');
      } else {
        say(PRAISES[Math.floor(Math.random() * PRAISES.length)]);
      }
    } else {
      say('Sem problemas, você pode marcar de novo quando terminar!');
    }

    save();
    renderTasks();

    var levelAfter = getLevelIndex(state.xp);
    if (levelAfter > levelBefore) {
      renderDino('levelup');
      launchConfetti();
      setTimeout(function () { say('Parabéns! O Dino subiu de nível: ' + LEVELS[levelAfter].name + '! 🦕✨'); }, 50);
    } else {
      renderDino(task.done ? 'bounce' : null);
    }
  }

  function deleteTask(id) {
    state.tasks = state.tasks.filter(function (t) { return t.id !== id; });
    save();
    render();
  }

  function launchConfetti() {
    var emojis = ['🎉', '⭐', '✨', '🎊', '💙'];
    for (var i = 0; i < 18; i++) {
      (function () {
        var el = document.createElement('span');
        el.className = 'confetti';
        el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        el.style.left = Math.random() * 100 + 'vw';
        el.style.animationDuration = (2 + Math.random() * 1.5) + 's';
        document.body.appendChild(el);
        setTimeout(function () { el.remove(); }, 3600);
      })();
    }
  }
})();
</script>
</body>
</html>
